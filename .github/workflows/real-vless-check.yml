name: Real VLESS Health Check

on:
  workflow_dispatch:
    inputs:
      max_configs:
        description: "Maximum configs to test (0 = all)"
        required: false
        default: "0"
      workers:
        description: "Parallel tests"
        required: false
        default: "4"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: real-vless-health-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      XRAY_BIN: ./xray
      WORKERS: ${{ github.event.inputs.workers || '4' }}
      MAX_CONFIGS: ${{ github.event.inputs.max_configs || '0' }}
      PROBE_TIMEOUT: "14"
      STARTUP_TIMEOUT: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest stable Xray
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          URL="$(curl -fsSL "$API" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          names=["Xray-linux-64.zip", "Xray-linux-x64.zip"]
          assets={a["name"]:a["browser_download_url"] for a in data["assets"]}
          for name in names:
              if name in assets:
                  print(assets[name])
                  break
          else:
              raise SystemExit("Linux x64 Xray asset not found")
          ')"
          curl -fL --retry 3 "$URL" -o xray.zip
          unzip -q xray.zip xray
          chmod +x xray
          ./xray version

      - name: Run real tunnel tests
        run: python3 scripts/real_test.py

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vless-health-results
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit healthy configs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d output || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/healthy.txt output/failed.txt output/results.json output/summary.json

          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi

          git commit -m "Update real VLESS health results"
          git push
